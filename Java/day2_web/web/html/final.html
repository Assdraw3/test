<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        *
        {
            padding: 0;
            margin: 0;
        }

        /*body*/
        /*{*/

        /*    background: url(https://image.baidu.com/search/down?thumburl=https://weibo.com&url=https://wx1.sinaimg.cn/large/006RKGBpgy1h1t0stra6mj30u00mxjtf.jpg);*/
        /*    background-position: top;*/
        /*    background-repeat: no-repeat;*/
        /*}*/

        .box
        {
            /* 绝对定位 */
            position: absolute;
            left: 50%;
            top : 50%;
            transform:translate(-50%,-50%);
            /* 设置宽高背景颜色 */
            background-color: rgb(111, 12, 143);
            width: 400px;
            /* 文字居中 */
            text-align: center;
            /* 设置圆角 */
            border-radius: 20px;
            /* 文字大小 */
            font-size: 20px;
        }
        h1
        {
            color: white



        }
        .text
        {
            /* 将行元素设置成块元素 */
            display: block;
            /* 上下各撑开10px左右居中 */
            margin: 10px auto;
            /* 内边距 */
            padding:10px 20px;
            /* 宽度 */
            width: 180px;
            /* 设置文本居中 */
            text-align: center;
            /* 字体大小 */
            font-size: 15px;

        }
        .button
        {
            padding: 5px 30px;
            border-radius: 10px;
            background-color: blue;
            color: white;
            /* 取消所有样式 */
            border: none;
        }
    </style>
    <link rel = "stylesheet" type = "text/css" href = "../style.css">
</head>
<body>
<form action = "http://localhost:8088/web/login" method = "post">
    <div class = "box">
        <h1>登录</h1>
        <input type = "text" class = "text" name = "username" placeholder="用户名"/>
        <input type = "password" class = "text" name = "password" placeholder="密码"/>
        <input type = "submit" class = "button" value = "登录"/>
    </div>

</form>

</body>
</html>
